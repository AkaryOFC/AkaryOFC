product engineer basée à Lyon.</text><text x="48" y="268" fill="#f8f4ff" font-family="Arial,Helvetica,sans-serif" font-size="20">Je relie logiciel, terrain, identité, sécurité et temps réel.</text><text x="48" y="303" fill="#f8f4ff" font-family="Arial,Helvetica,sans-serif" font-size="20">Mon centre de gravité : .NET / C#, mais je pense le système entier.</text><rect x="48" y="336" width="724" height="92" rx="18" fill="#080914" stroke="#ff2dbd" stroke-width="2"/><text x="72" y="371" fill="#9aa5c1" font-family="monospace" font-size="17">EVIECRÈVE = SIGNATURE VISUELLE, PAS PROJET GITHUB.</text><text x="72" y="402" fill="#f8f4ff" font-family="monospace" font-size="18">SÉRIEUSE SUR LE SYSTÈME. JAMAIS NEUTRE SUR L’IDENTITÉ.</text><g transform="rotate(-12 705 459)"><rect x="660" y="444" width="90" height="30" rx="15" fill="none" stroke="#ff68cb" stroke-width="3"/><path d="M705 446v26" stroke="#2ec8ff" stroke-width="3"/></g><g fill="none" stroke="#9aa5c1" stroke-width="3"><ellipse cx="52" cy="462" rx="17" ry="9" transform="rotate(18 52 462)"/><ellipse cx="82" cy="462" rx="17" ry="9" transform="rotate(-18 82 462)"/><ellipse cx="112" cy="462" rx="17" ry="9" transform="rotate(18 112 462)"/><ellipse cx="142" cy="462" rx="17" ry="9" transform="rotate(-18 142 462)"/><ellipse cx="172" cy="462" rx="17" ry="9" transform="rotate(18 172 462)"/></g></svg>